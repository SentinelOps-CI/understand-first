[package]
name = "uf_rust_ast"
version = "0.1.0"
edition = "2021"
publish = false
description = "Understand-First Rust AST worker (syn parse-only)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

