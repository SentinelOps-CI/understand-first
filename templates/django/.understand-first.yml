# django project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/model_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  models:
  - '*/models.py'
  - '*/models/*.py'
  views:
  - '*/views.py'
  - '*/views/*.py'
  - '*/api_views.py'
  urls:
  - '*/urls.py'
  - '*/urlpatterns.py'
  admin:
  - '*/admin.py'
  - '*/admin/*.py'
  forms:
  - '*/forms.py'
  - '*/forms/*.py'
  serializers:
  - '*/serializers.py'
  - '*/serializers/*.py'
  api:
  - '*/api/*.py'
  - '*/viewsets.py'
  - '*/permissions.py'
  - '*/filters.py'
  services:
  - '*/services.py'
  - '*/services/*.py'
  - '*/business_logic.py'
  - '*/utils.py'
  tests:
  - '*/test*.py'
  - '*/tests.py'
  - '*/test_*.py'
  - tests/*.py
  management:
  - '*/management/commands/*.py'
  signals:
  - '*/signals.py'
  - '*/signals/*.py'
  middleware:
  - '*/middleware.py'
  - '*/middleware/*.py'
  bug:
  - '*/models.py'
  - '*/views.py'
  - '*/admin.py'
  - '*/forms.py'
  feature:
  - '*/models.py'
  - '*/views.py'
  - '*/urls.py'
  - '*/forms.py'
  - '*/templates/**/*.html'
  api_development:
  - '*/api/*.py'
  - '*/serializers.py'
  - '*/viewsets.py'
  - '*/permissions.py'
  performance:
  - '*/models.py'
  - '*/views.py'
  - '*/queries.py'
  - '*/cache.py'
glossary_path: docs/glossary.md
