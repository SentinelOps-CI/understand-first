# fastapi project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/schema_contracts.yaml
- contracts/endpoint_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - main.py
  - app.py
  - run.py
  routes:
  - '*/routes/*.py'
  - '*/api/*.py'
  - '*/endpoints/*.py'
  - '*/routers/*.py'
  models:
  - '*/models.py'
  - '*/models/*.py'
  - '*/schemas.py'
  - '*/schemas/*.py'
  services:
  - '*/services/*.py'
  - '*/core/*.py'
  - '*/business/*.py'
  - '*/logic/*.py'
  dependencies:
  - '*/dependencies.py'
  - '*/deps.py'
  - '*/auth.py'
  - '*/permissions.py'
  middleware:
  - '*/middleware.py'
  - '*/middleware/*.py'
  database:
  - '*/database.py'
  - '*/db.py'
  - '*/connection.py'
  - '*/migrations/*.py'
  api:
  - '*/api/*.py'
  - '*/endpoints/*.py'
  - '*/routers/*.py'
  - '*/controllers/*.py'
  auth:
  - '*/auth/*.py'
  - '*/security/*.py'
  - '*/jwt.py'
  - '*/oauth.py'
  workers:
  - '*/workers/*.py'
  - '*/tasks/*.py'
  - '*/celery/*.py'
  - '*/background/*.py'
  config:
  - '*/config.py'
  - '*/settings.py'
  - '*/env.py'
  - '*/constants.py'
  tests:
  - test_*.py
  - '*/test_*.py'
  - '*/tests/*.py'
  - '*/conftest.py'
  bug:
  - main.py
  - '*/routes/*.py'
  - '*/models.py'
  - '*/services/*.py'
  feature:
  - '*/routes/*.py'
  - '*/models.py'
  - '*/schemas.py'
  - '*/services/*.py'
  - '*/api/*.py'
  api_development:
  - '*/api/*.py'
  - '*/routes/*.py'
  - '*/schemas.py'
  - '*/dependencies.py'
  performance:
  - '*/services/*.py'
  - '*/database.py'
  - '*/cache.py'
  - '*/workers/*.py'
  security:
  - '*/auth/*.py'
  - '*/security/*.py'
  - '*/dependencies.py'
  - '*/middleware.py'
glossary_path: docs/glossary.md
