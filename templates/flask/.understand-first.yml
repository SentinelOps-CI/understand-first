# flask project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/endpoint_contracts.yaml
- contracts/form_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - app.py
  - main.py
  - run.py
  - wsgi.py
  blueprints:
  - '*/blueprints/*.py'
  - '*/blueprint*.py'
  - '*/routes/*.py'
  - '*/views/*.py'
  models:
  - '*/models.py'
  - '*/models/*.py'
  - '*/database.py'
  - '*/db.py'
  forms:
  - '*/forms.py'
  - '*/forms/*.py'
  - '*/wtf_forms.py'
  templates:
  - '*/templates/**/*.html'
  - '*/templates/**/*.jinja2'
  - '*/templates/**/*.j2'
  static:
  - '*/static/**/*.js'
  - '*/static/**/*.css'
  - '*/static/**/*.html'
  api:
  - '*/api/*.py'
  - '*/api_*.py'
  - '*/endpoints/*.py'
  - '*/rest/*.py'
  auth:
  - '*/auth/*.py'
  - '*/security/*.py'
  - '*/login.py'
  - '*/permissions.py'
  services:
  - '*/services/*.py'
  - '*/business/*.py'
  - '*/logic/*.py'
  - '*/utils.py'
  config:
  - '*/config.py'
  - '*/settings.py'
  - '*/env.py'
  - '*/constants.py'
  extensions:
  - '*/extensions.py'
  - '*/plugins/*.py'
  - '*/middleware/*.py'
  tasks:
  - '*/tasks/*.py'
  - '*/workers/*.py'
  - '*/celery/*.py'
  - '*/background/*.py'
  tests:
  - '*/test*.py'
  - '*/tests/*.py'
  - '*/conftest.py'
  - test_*.py
  bug:
  - app.py
  - '*/blueprints/*.py'
  - '*/models.py'
  - '*/forms.py'
  feature:
  - '*/blueprints/*.py'
  - '*/models.py'
  - '*/forms.py'
  - '*/templates/**/*.html'
  - '*/static/**/*.js'
  api_development:
  - '*/api/*.py'
  - '*/blueprints/*.py'
  - '*/models.py'
  - '*/services/*.py'
  performance:
  - '*/services/*.py'
  - '*/models.py'
  - '*/cache.py'
  - '*/database.py'
  security:
  - '*/auth/*.py'
  - '*/security/*.py'
  - '*/permissions.py'
  - '*/middleware/*.py'
glossary_path: docs/glossary.md
