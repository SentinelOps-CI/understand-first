# go project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/service_contracts.yaml
- contracts/interface_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - main.go
  - cmd/**/*.go
  - app.go
  - server.go
  handlers:
  - handlers/*.go
  - '*/handlers/*.go'
  - '*/http/*.go'
  - '*/api/*.go'
  models:
  - models/*.go
  - '*/models/*.go'
  - '*/entities/*.go'
  - '*/domain/*.go'
  services:
  - services/*.go
  - '*/services/*.go'
  - '*/business/*.go'
  - '*/logic/*.go'
  repositories:
  - repositories/*.go
  - '*/repositories/*.go'
  - '*/dao/*.go'
  - '*/data/*.go'
  middleware:
  - middleware/*.go
  - '*/middleware/*.go'
  - '*/middlewares/*.go'
  database:
  - '*/database/*.go'
  - '*/db/*.go'
  - '*/connection/*.go'
  - '*/migrations/*.go'
  config:
  - config/*.go
  - '*/config/*.go'
  - '*/settings/*.go'
  - '*/env/*.go'
  utils:
  - utils/*.go
  - '*/utils/*.go'
  - '*/helpers/*.go'
  - '*/lib/*.go'
  tests:
  - '*_test.go'
  - '**/*_test.go'
  - test/*.go
  - '*/test/*.go'
  bug:
  - main.go
  - handlers/*.go
  - models/*.go
  - services/*.go
  feature:
  - handlers/*.go
  - models/*.go
  - services/*.go
  - repositories/*.go
  api_development:
  - '*/api/*.go'
  - '*/handlers/*.go'
  - '*/models/*.go'
  - '*/middleware/*.go'
  performance:
  - '*/services/*.go'
  - '*/database/*.go'
  - '*/cache/*.go'
  - '*/utils/*.go'
glossary_path: docs/glossary.md
