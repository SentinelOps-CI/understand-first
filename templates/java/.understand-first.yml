# java project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/service_contracts.yaml
- contracts/interface_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - '**/Application.java'
  - '**/Main.java'
  - '**/App.java'
  - '**/Server.java'
  controllers:
  - '**/controller/*.java'
  - '**/web/*.java'
  - '**/api/*.java'
  - '**/rest/*.java'
  services:
  - '**/service/*.java'
  - '**/business/*.java'
  - '**/logic/*.java'
  - '**/impl/*.java'
  models:
  - '**/model/*.java'
  - '**/entity/*.java'
  - '**/domain/*.java'
  - '**/dto/*.java'
  repositories:
  - '**/repository/*.java'
  - '**/dao/*.java'
  - '**/data/*.java'
  - '**/persistence/*.java'
  configuration:
  - '**/config/*.java'
  - '**/configuration/*.java'
  - '**/settings/*.java'
  - '**/properties/*.java'
  spring:
  - '**/@Controller'
  - '**/@Service'
  - '**/@Repository'
  - '**/@Component'
  - '**/@Configuration'
  tests:
  - '**/test/**/*.java'
  - '**/*Test.java'
  - '**/*Tests.java'
  - '**/test/*.java'
  bug:
  - '**/Application.java'
  - '**/controller/*.java'
  - '**/service/*.java'
  - '**/model/*.java'
  feature:
  - '**/controller/*.java'
  - '**/service/*.java'
  - '**/model/*.java'
  - '**/repository/*.java'
  api_development:
  - '**/api/*.java'
  - '**/controller/*.java'
  - '**/service/*.java'
  - '**/model/*.java'
  performance:
  - '**/service/*.java'
  - '**/repository/*.java'
  - '**/cache/*.java'
  - '**/util/*.java'
glossary_path: docs/glossary.md
