# microservices project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/service_contracts.yaml
- contracts/api_contracts.yaml
- contracts/grpc_contracts.yaml
- contracts/event_contracts.yaml
hops: 4
seeds: []
metrics:
  enabled: true
seeds_for:
  services:
  - '*/service*.py'
  - '*/api*.py'
  - '*/main.py'
  - '*/app.py'
  clients:
  - '*/client*.py'
  - '*/clients/*.py'
  - '*/http_client*.py'
  - '*/grpc_client*.py'
  models:
  - '*/models.py'
  - '*/models/*.py'
  - '*/schemas.py'
  - '*/schemas/*.py'
  - '*/entities.py'
  - '*/entities/*.py'
  api:
  - '*/api/*.py'
  - '*/endpoints/*.py'
  - '*/routes/*.py'
  - '*/handlers/*.py'
  grpc:
  - '*/grpc/*.py'
  - '*/proto/*.py'
  - '*/pb2/*.py'
  - '*/pb2_grpc.py'
  messaging:
  - '*/messaging/*.py'
  - '*/events/*.py'
  - '*/publishers/*.py'
  - '*/subscribers/*.py'
  - '*/consumers/*.py'
  database:
  - '*/database.py'
  - '*/db.py'
  - '*/connection.py'
  - '*/migrations/*.py'
  - '*/repositories/*.py'
  cache:
  - '*/cache.py'
  - '*/redis*.py'
  - '*/memcache*.py'
  config:
  - '*/config.py'
  - '*/settings.py'
  - '*/env.py'
  - '*/constants.py'
  - '*/secrets.py'
  infrastructure:
  - '*/infrastructure/*.py'
  - '*/deployment/*.py'
  - '*/docker/*.py'
  - '*/k8s/*.py'
  monitoring:
  - '*/monitoring/*.py'
  - '*/metrics/*.py'
  - '*/logging.py'
  - '*/tracing.py'
  - '*/health.py'
  security:
  - '*/auth/*.py'
  - '*/security/*.py'
  - '*/permissions.py'
  - '*/client*.py'
  tests:
  - '*/test*.py'
  - '*/tests/*.py'
  - '*/conftest.py'
  - '*/fixtures/*.py'
  bug:
  - '*/service*.py'
  - '*/api*.py'
  - '*/client*.py'
  - '*/models.py'
  feature:
  - '*/service*.py'
  - '*/api*.py'
  - '*/models.py'
  - '*/schemas.py'
  - '*/client*.py'
  integration:
  - '*/client*.py'
  - '*/api/*.py'
  - '*/messaging/*.py'
  - '*/grpc/*.py'
  performance:
  - '*/service*.py'
  - '*/database.py'
  - '*/cache.py'
  - '*/monitoring/*.py'
  deployment:
  - '*/infrastructure/*.py'
  - '*/deployment/*.py'
  - '*/docker/*.py'
  - '*/k8s/*.py'
glossary_path: docs/glossary.md
