# nodejs project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/endpoint_contracts.yaml
- contracts/schema_contracts.yaml
hops: 3
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - app.js
  - server.js
  - index.js
  - main.js
  routes:
  - routes/*.js
  - '*/routes/*.js'
  - '*/api/*.js'
  - '*/endpoints/*.js'
  controllers:
  - controllers/*.js
  - '*/controllers/*.js'
  - '*/handlers/*.js'
  - '*/actions/*.js'
  models:
  - models/*.js
  - '*/models/*.js'
  - '*/schemas/*.js'
  - '*/entities/*.js'
  services:
  - services/*.js
  - '*/services/*.js'
  - '*/business/*.js'
  - '*/logic/*.js'
  middleware:
  - middleware/*.js
  - '*/middleware/*.js'
  - '*/middlewares/*.js'
  database:
  - '*/database/*.js'
  - '*/db/*.js'
  - '*/connection/*.js'
  - '*/migrations/*.js'
  config:
  - config/*.js
  - '*/config/*.js'
  - '*/settings/*.js'
  - '*/env/*.js'
  utils:
  - utils/*.js
  - '*/utils/*.js'
  - '*/helpers/*.js'
  - '*/lib/*.js'
  tests:
  - test/*.js
  - '*/test/*.js'
  - '**/*.test.js'
  - '**/*.spec.js'
  - tests/*.js
  bug:
  - app.js
  - server.js
  - routes/*.js
  - controllers/*.js
  feature:
  - routes/*.js
  - controllers/*.js
  - models/*.js
  - services/*.js
  api_development:
  - '*/api/*.js'
  - '*/routes/*.js'
  - '*/controllers/*.js'
  - '*/middleware/*.js'
  performance:
  - '*/services/*.js'
  - '*/database/*.js'
  - '*/cache/*.js'
  - '*/utils/*.js'
glossary_path: docs/glossary.md
