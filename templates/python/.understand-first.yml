# python project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/function_contracts.yaml
- contracts/class_contracts.yaml
hops: 2
seeds: []
metrics:
  enabled: true
seeds_for:
  main:
  - main.py
  - app.py
  - run.py
  - cli.py
  - __main__.py
  modules:
  - '*.py'
  - '*/__init__.py'
  - '*/core/*.py'
  - '*/lib/*.py'
  utils:
  - utils/*.py
  - '*/utils/*.py'
  - '*/helpers/*.py'
  - '*/common/*.py'
  services:
  - '*/services/*.py'
  - '*/business/*.py'
  - '*/logic/*.py'
  - '*/core/*.py'
  models:
  - '*/models/*.py'
  - '*/entities/*.py'
  - '*/schemas/*.py'
  - '*/data/*.py'
  api:
  - '*/api/*.py'
  - '*/endpoints/*.py'
  - '*/routes/*.py'
  - '*/handlers/*.py'
  config:
  - '*/config/*.py'
  - '*/settings/*.py'
  - '*/env/*.py'
  - '*/constants.py'
  tests:
  - test_*.py
  - '*/test_*.py'
  - '*/tests/*.py'
  - tests/*.py
  - '*/conftest.py'
  bug:
  - main.py
  - app.py
  - '*/core/*.py'
  - '*/services/*.py'
  feature:
  - '*/core/*.py'
  - '*/services/*.py'
  - '*/models/*.py'
  - '*/api/*.py'
  api_development:
  - '*/api/*.py'
  - '*/endpoints/*.py'
  - '*/handlers/*.py'
  - '*/models/*.py'
  performance:
  - '*/services/*.py'
  - '*/core/*.py'
  - '*/utils/*.py'
  - '*/cache/*.py'
glossary_path: docs/glossary.md
