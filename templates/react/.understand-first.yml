# react project template for Understand-First
# Keys limited to runtime SCHEMA (ucli.config.SCHEMA).

contracts_paths:
- contracts/api_contracts.yaml
- contracts/component_contracts.yaml
- contracts/prop_contracts.yaml
hops: 2
seeds: []
metrics:
  enabled: true
seeds_for:
  components:
  - src/components/**/*.js
  - src/components/**/*.jsx
  - src/components/**/*.ts
  - src/components/**/*.tsx
  pages:
  - src/pages/**/*.js
  - src/pages/**/*.jsx
  - src/pages/**/*.ts
  - src/pages/**/*.tsx
  hooks:
  - src/hooks/**/*.js
  - src/hooks/**/*.ts
  - src/hooks/**/*.jsx
  - src/hooks/**/*.tsx
  utils:
  - src/utils/**/*.js
  - src/utils/**/*.ts
  - src/helpers/**/*.js
  - src/helpers/**/*.ts
  services:
  - src/services/**/*.js
  - src/services/**/*.ts
  - src/api/**/*.js
  - src/api/**/*.ts
  store:
  - src/store/**/*.js
  - src/store/**/*.ts
  - src/redux/**/*.js
  - src/redux/**/*.ts
  - src/context/**/*.js
  - src/context/**/*.ts
  styles:
  - src/styles/**/*.css
  - src/styles/**/*.scss
  - src/styles/**/*.sass
  - src/styles/**/*.less
  - src/**/*.module.css
  main:
  - src/App.js
  - src/App.jsx
  - src/App.ts
  - src/App.tsx
  - src/index.js
  - src/index.ts
  - src/main.js
  - src/main.ts
  routing:
  - src/routes/**/*.js
  - src/routes/**/*.jsx
  - src/routes/**/*.ts
  - src/routes/**/*.tsx
  - src/router/**/*.js
  - src/router/**/*.ts
  config:
  - src/config/**/*.js
  - src/config/**/*.ts
  - src/constants/**/*.js
  - src/constants/**/*.ts
  - src/settings/**/*.js
  - src/settings/**/*.ts
  tests:
  - src/**/*.test.js
  - src/**/*.test.jsx
  - src/**/*.test.ts
  - src/**/*.test.tsx
  - src/**/*.spec.js
  - src/**/*.spec.jsx
  - src/**/*.spec.ts
  - src/**/*.spec.tsx
  - tests/**/*.js
  - tests/**/*.ts
  bug:
  - src/App.js
  - src/App.jsx
  - src/components/**/*.js
  - src/components/**/*.jsx
  feature:
  - src/components/**/*.js
  - src/components/**/*.jsx
  - src/pages/**/*.js
  - src/pages/**/*.jsx
  - src/hooks/**/*.js
  - src/hooks/**/*.ts
  performance:
  - src/components/**/*.js
  - src/components/**/*.jsx
  - src/hooks/**/*.js
  - src/hooks/**/*.ts
  - src/services/**/*.js
  - src/services/**/*.ts
  state_management:
  - src/store/**/*.js
  - src/store/**/*.ts
  - src/redux/**/*.js
  - src/redux/**/*.ts
  - src/context/**/*.js
  - src/context/**/*.ts
  api_integration:
  - src/services/**/*.js
  - src/services/**/*.ts
  - src/api/**/*.js
  - src/api/**/*.ts
  - src/hooks/**/*.js
  - src/hooks/**/*.ts
glossary_path: docs/glossary.md
